name: Deploy to GitHub Pages

# 触发：推送 main；以及手动触发。
# 项目页部署在 https://<owner>.github.io/<repo>/ 子路径下，
# 因此构建时把 VITE_BASE 设为 /<repo>/，由 vite 输出带前缀的资源路径。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 校验测试与类型
        run: npm run typecheck && npm test

      - name: 构建（子路径 base）
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: 发布检查（含产物凭据扫描）
        # 直接调脚本而不是 `npm run verify:release`：后者会重新构建一遍，而
        # 那次构建没有 VITE_BASE，扫到的不是本次要部署的产物。
        run: node scripts/verify-release.mjs

      - name: 确认未把真实健康数据打进产物
        run: |
          # 只检测真实历史数据中独有的具体食物名。
          # 不要加入「晨起空腹」这类通用词——它是输入框 placeholder 文案，
          # 会让所有用户构建的产物都命中，导致误报。
          if grep -rlE '肉包子|肉夹馍' dist/ ; then
            echo "::error::构建产物疑似包含真实健康数据，中止部署"
            exit 1
          fi
          echo "产物中未发现真实健康数据样本"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
